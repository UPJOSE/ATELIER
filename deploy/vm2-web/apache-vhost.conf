# ====================================================================
# CONFIGURACIÓN APACHE 2.4 - VIRTUAL HOST
# VM2: Capas de Presentación (React) y Aplicación (PHP REST API)
# ====================================================================

<VirtualHost *:80>
    ServerName 64.236.189.196
    ServerAdmin admin@tienda.com
    
    # Capa de Presentación: React compilado en producción (dist)
    DocumentRoot /var/www/ecommerce/frontend/dist

    <Directory /var/www/ecommerce/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Enrutamiento SPA para React Router (Client-side routing)
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Capa de Aplicación: API REST PHP
    # Enrutamiento de todas las solicitudes que comiencen con /api/* hacia index.php
    Alias /api /var/www/ecommerce/backend/public/api/index.php

    <Directory /var/www/ecommerce/backend/public/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    # Bloquear acceso directo a carpetas sensibles del backend
    <Directory /var/www/ecommerce/backend/config>
        Require all denied
    </Directory>
    <Directory /var/www/ecommerce/backend/models>
        Require all denied
    </Directory>
    <Directory /var/www/ecommerce/backend/controllers>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/ecommerce_error.log
    CustomLog ${APACHE_LOG_DIR}/ecommerce_access.log combined
</VirtualHost>
